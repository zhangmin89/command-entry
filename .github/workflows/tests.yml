name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [Managed, NativeAot]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run tests
        shell: pwsh
        run: ./scripts/test.ps1 -Mode ${{ matrix.mode }}
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.mode }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
